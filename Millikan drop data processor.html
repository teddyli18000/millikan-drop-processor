<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密立根油滴实验 - 数据处理平台</title>
  
  <!-- 引入样式库 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 React 核心库 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- 引入图表库 Recharts 及其依赖 -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
  
  <!-- 引入 Babel 编译器以在浏览器中运行 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    /* 隐藏数字输入框的上下箭头 */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const { ScatterChart, Scatter, XAxis, YAxis, CartesianGrid, Tooltip, ReferenceLine, ResponsiveContainer, LabelList, LineChart, Line } = Recharts;

    // --- 内置图标组件 (替代 Lucide) ---
    const IconTestTube = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 7V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v1"/><path d="M21 7H3"/><path d="M12 22a7 7 0 0 0 7-7V7H5v8a7 7 0 0 0 7 7z"/><path d="M12 22v-4"/><path d="M9 13h6"/></svg>
    );
    const IconPlay = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"/></svg>
    );
    const IconAlert = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    );
    const IconFile = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M10 12h4"/><path d="M10 16h4"/></svg>
    );
    const IconCalc = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
    );
    const IconTrend = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
    );
    const IconSettings = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    );
    const IconInfo = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    );
    const IconCheck = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    );


    // ---------------------------
    // 初始默认数据和配置
    // ---------------------------
    const DEFAULT_CONSTANTS = {
      rho: 981,         
      g: 9.794,         
      l: 1.5e-3,        
      d: 5.0e-3,        
      eta: 1.83e-5,     
      b: 6.17e-6,       
      p: 76.0,          
      delta_U: 1,       
      delta_t: 0.01,    
      e_theo: 1.602e-19 
    };

    const INITIAL_DATA = [
      { U: [170, 171, 169, 170, 172], t: [12.21, 12.22, 12.28, 12.12, 12.31] }, 
      { U: [100, 98, 102, 100, 104], t: [14.26, 14.24, 14.26, 14.26, 14.24] },
      { U: [247, 249, 248, 247, 244], t: [9.28, 9.30, 9.28, 9.26, 9.28] },
      { U: [121, 121, 121, 122, 121], t: [8.74, 8.72, 8.74, 8.74, 8.74] },
      { U: [234, 234, 232, 230, 234], t: [6.88, 6.86, 7.00, 6.96, 6.89] }
    ];

    function App() {
      const [constants, setConstants] = useState(DEFAULT_CONSTANTS);
      const [config, setConfig] = useState({ numDrops: 5, numTrials: 5 });
      const [data, setData] = useState(INITIAL_DATA);
      const [results, setResults] = useState(null);
      const [errorMsg, setErrorMsg] = useState("");
      const [activeTab, setActiveTab] = useState("input");

      const handleConfigChange = (key, value) => {
        let num = parseInt(value, 10);
        if (isNaN(num) || num < 1) num = 1;
        if (num > 15) num = 15;

        setConfig(prev => ({ ...prev, [key]: num }));
        setData(prevData => {
          let newData = [...prevData];
          if (key === 'numDrops') {
            if (num > newData.length) {
              const trialsCount = config.numTrials;
              for (let i = newData.length; i < num; i++) {
                newData.push({ U: Array(trialsCount).fill(''), t: Array(trialsCount).fill('') });
              }
            } else {
              newData = newData.slice(0, num);
            }
          }
          if (key === 'numTrials') {
            newData = newData.map(drop => {
              let newU = [...drop.U];
              let newT = [...drop.t];
              if (num > newU.length) {
                newU = [...newU, ...Array(num - newU.length).fill('')];
                newT = [...newT, ...Array(num - newT.length).fill('')];
              } else {
                newU = newU.slice(0, num);
                newT = newT.slice(0, num);
              }
              return { U: newU, t: newT };
            });
          }
          return newData;
        });
      };

      const handleConstantChange = (key, value) => {
        setConstants(prev => ({ ...prev, [key]: parseFloat(value) }));
      };

      const handleDataChange = (dropIndex, type, trialIndex, value) => {
        setData(prev => {
          const newData = [...prev];
          newData[dropIndex][type][trialIndex] = value;
          return newData;
        });
      };

      const processData = () => {
        setErrorMsg("");
        let parsedData = [];

        for (let i = 0; i < config.numDrops; i++) {
          const U_vals = data[i].U.map(v => parseFloat(v));
          const t_vals = data[i].t.map(v => parseFloat(v));

          if (U_vals.some(isNaN) || t_vals.some(isNaN)) {
            setErrorMsg(`第 ${i + 1} 颗油滴的数据不完整或包含非数字！请确保填入所有数据。`);
            return;
          }
          if (U_vals.some(v => v <= 0) || t_vals.some(v => v <= 0)) {
            setErrorMsg(`第 ${i + 1} 颗油滴的电压或时间必须大于 0！`);
            return;
          }
          parsedData.push({ U: U_vals, t: t_vals });
        }

        const calculatedDrops = parsedData.map((drop, idx) => {
          const { rho, g, l, d, eta, b, p, delta_U, delta_t, e_theo } = constants;
          const numT = config.numTrials;

          const U_avg = drop.U.reduce((a, b) => a + b, 0) / numT;
          const t_avg = drop.t.reduce((a, b) => a + b, 0) / numT;

          const U_sd = Math.sqrt(drop.U.reduce((acc, val) => acc + Math.pow(val - U_avg, 2), 0) / (numT - 1) || 0);
          const t_sd = Math.sqrt(drop.t.reduce((acc, val) => acc + Math.pow(val - t_avg, 2), 0) / (numT - 1) || 0);

          const uA_U = U_sd / Math.sqrt(numT);
          const uB_U = delta_U / Math.sqrt(3);
          const uc_U = Math.sqrt(uA_U * uA_U + uB_U * uB_U);

          const uA_t = t_sd / Math.sqrt(numT);
          const uB_t = delta_t / Math.sqrt(3);
          const uc_t = Math.sqrt(uA_t * uA_t + uB_t * uB_t);

          const v_g = l / t_avg;
          const a = Math.sqrt((9 * eta * v_g) / (2 * rho * g));
          const correction = 1 + b / (p * a);

          const q_raw = (18 * Math.PI / Math.sqrt(2 * rho * g)) * Math.pow((eta * l) / (t_avg * correction), 1.5) * (d / U_avg);
          
          const n = Math.round(q_raw / e_theo);
          const e_measured = q_raw / n;

          const rel_u_U = uc_U / U_avg;
          const rel_u_t = (1.5 * uc_t) / t_avg;
          const uc_e = e_measured * Math.sqrt(rel_u_U * rel_u_U + rel_u_t * rel_u_t);

          return {
            id: idx + 1,
            U_avg, t_avg,
            uc_U, uc_t,
            a, q_raw, n,
            e_measured, uc_e
          };
        });

        const e_avg = calculatedDrops.reduce((acc, curr) => acc + curr.e_measured, 0) / config.numDrops;
        
        const sum_uc_e_sq = calculatedDrops.reduce((acc, curr) => acc + curr.uc_e * curr.uc_e, 0);
        const final_uc_e = (1 / config.numDrops) * Math.sqrt(sum_uc_e_sq);

        const percentage_error = (Math.abs(e_avg - constants.e_theo) / constants.e_theo) * 100;

        setResults({
          drops: calculatedDrops,
          e_avg,
          final_uc_e,
          percentage_error
        });
        
        setActiveTab("process");
      };

      const chartData = useMemo(() => {
        if (!results) return [];
        let sortedDrops = [...results.drops].sort((a, b) => a.q_raw - b.q_raw);
        
        return sortedDrops.map((d, index) => ({
          index: index + 1,
          q_raw: d.q_raw,
          n: d.n,
          e_meas: d.e_measured,
          label: `q${index+1}`
        }));
      }, [results]);

      const toSuperscript = (str) => {
        const map = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
        return str.toString().split('').map(c => map[c] || c).join('');
      };

      const formatSci = (num, fractionDigits = 3) => {
        if (num === 0) return '0';
        if (!num || isNaN(num)) return '-';
        const [base, exp] = num.toExponential(fractionDigits).split('e');
        return `${base} × 10${toSuperscript(exp.replace('+', ''))}`;
      };

      const TabButton = ({ active, onClick, icon, text, disabled }) => (
        <button
          onClick={onClick}
          disabled={disabled}
          className={`flex items-center px-4 py-2 text-sm font-medium rounded-lg transition-all
            ${active ? 'bg-white text-blue-700 shadow-sm font-bold' : 'text-slate-600 hover:bg-slate-300/50'}
            ${disabled ? 'opacity-40 cursor-not-allowed' : 'cursor-pointer'}
          `}
        >
          <span className="mr-2">{icon}</span>
          {text}
        </button>
      );

      const ConfigInput = ({ label, val, onChange, type="text", min, max }) => (
        <div>
          <label className="block text-xs font-semibold text-slate-500 mb-1">{label}</label>
          <input 
            type={type} min={min} max={max}
            className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all bg-slate-50"
            value={val}
            onChange={onChange}
          />
        </div>
      );

      const ConstantInput = ({ label, val, onChange, unit }) => (
        <div className="flex items-center justify-between bg-slate-50 p-2 rounded-lg border border-slate-200 hover:border-slate-300 transition-colors">
          <label className="text-sm font-medium text-slate-700 w-1/2">{label}</label>
          <div className="w-1/2 flex items-center">
            <input 
              type="number" step="any"
              className="w-full text-right bg-transparent outline-none font-mono text-blue-700 font-semibold"
              value={val}
              onChange={onChange}
            />
            <span className="ml-2 text-xs text-slate-400 w-12">{unit}</span>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans p-4 md:p-8">
          <div className="max-w-6xl mx-auto space-y-6">
            
            <header className="bg-white shadow-sm rounded-2xl p-6 border border-slate-200 flex flex-col md:flex-row items-center justify-between">
              <div className="flex items-center space-x-4">
                <div className="bg-blue-600 p-3 rounded-xl shadow-inner">
                  <IconTestTube className="text-white" />
                </div>
                <div>
                  <h1 className="text-2xl font-bold text-slate-900 tracking-tight">密立根油滴实验 - 分析平台</h1>
                  <p className="text-slate-500 text-sm mt-1">最小单元模型与误差传播严谨分析体系</p>
                </div>
              </div>
              <div className="mt-4 md:mt-0">
                <button 
                  onClick={processData}
                  className="flex items-center px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md transition-all active:scale-95"
                >
                  <IconPlay size={20} className="mr-2" />
                  一键验证与分析
                </button>
              </div>
            </header>

            {errorMsg && (
              <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-xl shadow-sm flex items-center">
                <IconAlert className="text-red-500 mr-3" />
                <span className="text-red-700 font-medium">{errorMsg}</span>
              </div>
            )}

            <div className="flex space-x-2 bg-slate-200 p-1 rounded-xl w-max">
              <TabButton active={activeTab === 'input'} onClick={() => setActiveTab('input')} icon={<IconFile size={18} />} text="1. 参数与数据阵列" />
              <TabButton active={activeTab === 'process'} onClick={() => setActiveTab('process')} disabled={!results} icon={<IconCalc size={18} />} text="2. 理论计算与完整表达" />
              <TabButton active={activeTab === 'visual'} onClick={() => setActiveTab('visual')} disabled={!results} icon={<IconTrend size={18} />} text="3. 量子化视觉铁证" />
            </div>

            {activeTab === 'input' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-in fade-in duration-300">
                <div className="lg:col-span-1 space-y-6">
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <h2 className="text-lg font-bold border-b pb-3 mb-4 flex items-center">
                      <IconSettings size={20} className="mr-2 text-slate-500" />
                      物理环境常数配置
                    </h2>
                    
                    <div className="grid grid-cols-2 gap-4">
                      <ConfigInput label="提取油滴数" val={config.numDrops} onChange={(e) => handleConfigChange('numDrops', e.target.value)} type="number" min="1" max="15"/>
                      <ConfigInput label="测量次数 / 滴" val={config.numTrials} onChange={(e) => handleConfigChange('numTrials', e.target.value)} type="number" min="1" max="15"/>
                    </div>

                    <div className="mt-6 space-y-3">
                      <ConstantInput label="空气粘滞系数 η" val={constants.eta} onChange={(e) => handleConstantChange('eta', e.target.value)} unit="Pa·s" />
                      <ConstantInput label="油滴密度 ρ" val={constants.rho} onChange={(e) => handleConstantChange('rho', e.target.value)} unit="kg/m³" />
                      <ConstantInput label="重力加速度 g" val={constants.g} onChange={(e) => handleConstantChange('g', e.target.value)} unit="m/s²" />
                      <ConstantInput label="坎宁安常数 b" val={constants.b} onChange={(e) => handleConstantChange('b', e.target.value)} unit="m·cmHg" />
                      <ConstantInput label="大气压强 p" val={constants.p} onChange={(e) => handleConstantChange('p', e.target.value)} unit="cmHg" />
                      <ConstantInput label="理论基本电荷 e₀" val={constants.e_theo} onChange={(e) => handleConstantChange('e_theo', e.target.value)} unit="C" />
                      
                      <div className="border-t pt-3 mt-3">
                        <p className="text-xs text-slate-400 font-semibold mb-2 uppercase tracking-wider">仪器 B 类不确定度源</p>
                        <ConstantInput label="平衡电压误差 ΔU" val={constants.delta_U} onChange={(e) => handleConstantChange('delta_U', e.target.value)} unit="V" />
                        <ConstantInput label="下落计时误差 Δt" val={constants.delta_t} onChange={(e) => handleConstantChange('delta_t', e.target.value)} unit="s" />
                      </div>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 overflow-x-auto">
                  <h2 className="text-lg font-bold border-b pb-3 mb-4">实验测量数据矩阵</h2>
                  <p className="text-sm text-slate-500 mb-4">
                    提示：所有油滴数据已载入预设实验记录，您可直接一键验证，或修改为您的实际测试数据。
                  </p>
                  <table className="w-full text-sm text-left border-collapse">
                    <thead className="bg-slate-50 text-slate-600">
                      <tr>
                        <th className="border p-2 rounded-tl-lg font-semibold w-24">标号</th>
                        <th className="border p-2 font-semibold w-20">变量</th>
                        {[...Array(config.numTrials)].map((_, i) => (
                          <th key={i} className="border p-2 font-semibold text-center">次序 {i+1}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {data.map((drop, dropIndex) => (
                        <React.Fragment key={dropIndex}>
                          <tr className="hover:bg-slate-50">
                            <td rowSpan={2} className="border p-2 font-medium text-center align-middle bg-slate-50/50">
                              第 {dropIndex + 1} 滴
                            </td>
                            <td className="border p-2 text-center text-blue-700 font-medium bg-blue-50/30">U (V)</td>
                            {drop.U.map((uVal, tIndex) => (
                              <td key={`u-${dropIndex}-${tIndex}`} className="border p-0">
                                <input
                                  type="number"
                                  className="w-full h-full p-2 outline-none text-center bg-transparent focus:bg-blue-50 transition-colors"
                                  value={uVal}
                                  onChange={(e) => handleDataChange(dropIndex, 'U', tIndex, e.target.value)}
                                  placeholder="-"
                                />
                              </td>
                            ))}
                          </tr>
                          <tr className="hover:bg-slate-50">
                            <td className="border p-2 text-center text-green-700 font-medium bg-green-50/30">t_g (s)</td>
                            {drop.t.map((tVal, tIndex) => (
                              <td key={`t-${dropIndex}-${tIndex}`} className="border p-0">
                                <input
                                  type="number"
                                  className="w-full h-full p-2 outline-none text-center bg-transparent focus:bg-green-50 transition-colors"
                                  value={tVal}
                                  onChange={(e) => handleDataChange(dropIndex, 't', tIndex, e.target.value)}
                                  placeholder="-"
                                />
                              </td>
                            ))}
                          </tr>
                        </React.Fragment>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'process' && results && (
              <div className="space-y-6 animate-in fade-in duration-300">
                
                <div className="bg-gradient-to-br from-blue-700 to-indigo-800 rounded-2xl p-8 shadow-lg text-white flex flex-col md:flex-row items-center justify-between relative overflow-hidden">
                  <div className="z-10">
                    <h2 className="text-xl font-medium text-blue-100 flex items-center">
                      <IconCheck size={24} className="mr-2 text-emerald-400" />
                      基本电荷量完整表达 (最佳估计值与总不确定度)
                    </h2>
                    <div className="mt-5 bg-black/20 p-4 rounded-xl border border-white/10 font-mono">
                      <span className="text-2xl text-blue-200 mr-2">e =</span>
                      <span className="text-4xl font-bold tracking-tight">
                        ( {(results.e_avg * 1e19).toFixed(3)} ± {(results.final_uc_e * 1e19).toFixed(3)} )
                      </span>
                      <span className="text-2xl ml-3 text-blue-200">× 10⁻¹⁹ C</span>
                    </div>
                  </div>
                  <div className="mt-6 md:mt-0 z-10 bg-white/10 backdrop-blur-sm p-5 rounded-xl border border-white/20 text-center shadow-inner">
                    <p className="text-sm text-blue-200 mb-1">测定值与理论值的相对误差</p>
                    <p className="text-4xl font-extrabold text-white">{results.percentage_error.toFixed(2)}<span className="text-2xl">%</span></p>
                  </div>
                </div>

                <div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-xl text-blue-800 text-sm">
                  <strong className="block mb-1">📖 最小单元模型算法说明：</strong>
                  依据宏观动力学推导求得绝对电荷量 <span className="font-mono bg-blue-100 px-1 rounded">qᵢ</span> 后，通过寻找其最大公约数（即 <span className="font-mono bg-blue-100 px-1 rounded">n = round(qᵢ / e₀)</span>）提取出离散的整数电子数。反求单次实验的基本电荷 <span className="font-mono bg-blue-100 px-1 rounded">eᵢ = qᵢ / n</span>，最终结果 <span className="font-mono bg-blue-100 px-1 rounded">e</span> 取各次测量值 <span className="font-mono bg-blue-100 px-1 rounded">eᵢ</span> 的算术平均，完全契合 PPT 推导范式。
                </div>

                <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 overflow-x-auto">
                    <h3 className="text-lg font-bold border-b pb-3 mb-4 flex items-center">
                      <IconInfo size={20} className="mr-2 text-blue-500" />基础推导与绝对电荷提取
                    </h3>
                    <table className="w-full text-sm text-left border-collapse whitespace-nowrap">
                      <thead className="bg-slate-50 text-slate-600 border-b">
                        <tr>
                          <th className="p-2 font-semibold">标号</th>
                          <th className="p-2 font-semibold">U_avg (V)</th>
                          <th className="p-2 font-semibold">t_avg (s)</th>
                          <th className="p-2 font-semibold">电荷量 qᵢ (C)</th>
                          <th className="p-2 font-semibold text-center">电子数 n</th>
                        </tr>
                      </thead>
                      <tbody>
                        {results.drops.map(d => (
                          <tr key={d.id} className="border-b last:border-0 hover:bg-slate-50">
                            <td className="p-2 font-medium text-slate-700">q {d.id}</td>
                            <td className="p-2 font-mono">{d.U_avg.toFixed(2)}</td>
                            <td className="p-2 font-mono">{d.t_avg.toFixed(3)}</td>
                            <td className="p-2 font-mono text-blue-700 font-semibold">{formatSci(d.q_raw)}</td>
                            <td className="p-2 text-center font-bold text-slate-800 bg-slate-100/80 rounded">{d.n}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 overflow-x-auto">
                    <h3 className="text-lg font-bold border-b pb-3 mb-4 flex items-center">
                      <IconInfo size={20} className="mr-2 text-indigo-500" />最小单元 eᵢ 测定与不确定度追踪
                    </h3>
                    <table className="w-full text-sm text-left border-collapse whitespace-nowrap">
                      <thead className="bg-slate-50 text-slate-600 border-b">
                        <tr>
                          <th className="p-2 font-semibold">标号</th>
                          <th className="p-2 font-semibold">u_c(U)</th>
                          <th className="p-2 font-semibold">u_c(t)</th>
                          <th className="p-2 font-semibold">单次 eᵢ (C)</th>
                          <th className="p-2 font-semibold text-indigo-700">合成 u_c(eᵢ)</th>
                        </tr>
                      </thead>
                      <tbody>
                        {results.drops.map(d => (
                          <tr key={d.id} className="border-b last:border-0 hover:bg-slate-50">
                            <td className="p-2 font-medium text-slate-700">Drop {d.id}</td>
                            <td className="p-2 font-mono text-slate-500">{d.uc_U.toFixed(3)}</td>
                            <td className="p-2 font-mono text-slate-500">{d.uc_t.toFixed(3)}</td>
                            <td className="p-2 font-mono font-medium text-slate-800">{formatSci(d.e_measured)}</td>
                            <td className="p-2 font-mono font-bold text-indigo-700 bg-indigo-50/50">{formatSci(d.uc_e)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'visual' && results && (
              <div className="space-y-6 animate-in fade-in duration-300">
                
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                  <div className="mb-6">
                    <h2 className="text-xl font-bold text-slate-800">电荷量子化的视觉铁证 (全阶梯对齐)</h2>
                    <p className="text-slate-500 text-sm mt-1">
                      Y 轴为实验获取的宏观绝对电荷量（科学计数法）。横向参考线严格以理论单元 <span className="font-mono">e₀</span> 的整数倍描绘。<br/>
                      可以看出所有测量的离散电荷 <span className="font-mono">qᵢ</span> 完美卡在了基本电荷的整数倍阶梯上。
                    </p>
                  </div>
                  
                  <div className="h-[450px] w-full">
                    <ResponsiveContainer width="100%" height="100%">
                      <ScatterChart margin={{ top: 20, right: 60, bottom: 20, left: 40 }}>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                        <XAxis 
                          type="number" 
                          dataKey="index" 
                          name="按电荷量升序排列的油滴" 
                          ticks={chartData.map(d => d.index)}
                          label={{ value: '油滴升序编号 (Drop Index)', position: 'insideBottom', offset: -10 }} 
                        />
                        <YAxis 
                          type="number" 
                          dataKey="q_raw" 
                          name="绝对电荷量" 
                          domain={[0, 'dataMax * 1.1']}
                          tickFormatter={(val) => formatSci(val, 2)}
                          label={{ value: '绝对电荷量 q (C)', angle: -90, position: 'insideLeft', offset: -20, style: { textAnchor: 'middle', fontWeight: 600 } }} 
                        />
                        <Tooltip 
                          cursor={{strokeDasharray: '3 3'}}
                          content={({ active, payload }) => {
                            if (active && payload && payload.length) {
                              const data = payload[0].payload;
                              return (
                                <div className="bg-white/95 backdrop-blur-sm p-4 border border-slate-200 shadow-xl rounded-xl">
                                  <p className="font-bold text-slate-800 mb-2 border-b pb-1">数据点: {data.label}</p>
                                  <p className="text-emerald-700 font-mono text-sm mb-1">推导电子数: n = {data.n}</p>
                                  <p className="text-blue-700 font-mono text-sm mb-1">绝对电荷量: {formatSci(data.q_raw)} C</p>
                                  <p className="text-indigo-700 font-mono text-sm">单次基本电荷: {formatSci(data.e_meas)} C</p>
                                </div>
                              );
                            }
                            return null;
                          }}
                        />
                        
                        {Array.from(new Set(chartData.map(d => d.n))).sort((a,b)=>a-b).map(n => (
                          <ReferenceLine 
                            key={n} 
                            y={n * constants.e_theo} 
                            stroke="#0f172a" 
                            strokeDasharray="4 4" 
                            strokeOpacity={0.4}
                            label={{ value: `${n}e₀`, position: 'right', fill: '#0f172a', fontSize: 13, fontWeight: 'bold' }}
                          />
                        ))}

                        <Scatter data={chartData} fill="#10b981">
                           <LabelList dataKey="label" position="top" offset={12} style={{ fill: '#475569', fontSize: 13, fontWeight: 600 }} />
                        </Scatter>
                      </ScatterChart>
                    </ResponsiveContainer>
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                  <div className="mb-6">
                    <h2 className="text-xl font-bold text-slate-800">测量电荷 q 与电子数 n 的宏观线性关系</h2>
                    <p className="text-slate-500 text-sm mt-1">拟合直线的理论斜率即代表最终基本电荷量大小（斜率 e = {formatSci(results.e_avg)} C）。</p>
                  </div>
                  <div className="h-[400px] w-full">
                    <ResponsiveContainer width="100%" height="100%">
                      <LineChart data={[{n: 0, q_raw: 0}, ...chartData.sort((a,b)=>a.n-b.n)]} margin={{ top: 20, right: 60, bottom: 20, left: 40 }}>
                        <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                        <XAxis type="number" dataKey="n" domain={[0, 'dataMax + 1']} label={{ value: '提取电子数 n', position: 'insideBottom', offset: -10 }} />
                        <YAxis 
                          type="number" 
                          dataKey="q_raw" 
                          domain={[0, 'dataMax * 1.1']} 
                          tickFormatter={(val) => formatSci(val, 2)}
                          label={{ value: '宏观电荷量 q (C)', angle: -90, position: 'insideLeft', offset: -20, style: { fontWeight: 600 } }} 
                        />
                        <Tooltip 
                          formatter={(val, name) => [formatSci(val), name]}
                          labelFormatter={(label) => `电子数 n = ${label}`}
                        />
                        <Line type="linear" dataKey={(d) => d.n * results.e_avg} stroke="#3b82f6" strokeWidth={2} dot={false} name="理论拟合路径 (q = n·e)" />
                        <Line type="monotone" dataKey="q_raw" stroke="none" dot={{r: 6, fill: '#ef4444', strokeWidth: 2}} name="实验实测电荷 q" />
                      </LineChart>
                    </ResponsiveContainer>
                  </div>
                </div>

              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
